[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "betun-backend"
version = "0.1.0"
description = "Local-first two-camera Odia podcast backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "scipy>=1.14,<2", "indic-transliteration==2.3.75"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "huggingface-hub>=1,<3"]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
betun = "betun.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.package-data]
betun = ["ui/*"]
