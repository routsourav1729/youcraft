name: Updater handoff regression
on:
  push:
    branches: [fix/updater-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5 regression checks
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/file-update.ps1
          if ($LASTEXITCODE) { throw 'Transaction regression failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/updater-handoff.ps1
          if ($LASTEXITCODE) { throw 'Handoff regression failed' }
