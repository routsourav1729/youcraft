name: YouCraft Windows V1
on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the complete native regression and backend suite
        type: boolean
        default: false
      full_setup:
        description: Reinstall and validate speech/reaction packs (for setup changes)
        type: boolean
        default: false
  push:
    branches: [ama-bartalap]
  pull_request:
    branches: [ama-bartalap]
concurrency:
  group: youcraft-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      FILMCRAFT_REQUIRE_WINRES: 1
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        shell: pwsh
        run: |
          $version = (Get-Content packaging/youcraft-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "YOUCRAFT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate setup helpers
        shell: pwsh
        run: |
          Get-ChildItem packaging/ama/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/file-update.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Incremental updater regression failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/background-update.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Background update regression failed' }
      - name: External media test tools
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-media.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Verified media setup failed' }
          $mediaConfig = Get-Content "$env:LOCALAPPDATA/YouCraft/media-tools.json" -Raw | ConvertFrom-Json
          (Split-Path $mediaConfig.ffmpeg) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $mediaConfig.ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mediaConfig.ffprobe -version
      - name: Package Python analysis service when included in source bundle
        if: ${{ hashFiles('ama-backend/pyproject.toml') != '' }}
        working-directory: ama-backend
        run: |
          python -m pip install '.[packaging,test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ inputs.full_checks }}' -eq 'true') { python -m pytest -q tests }
          else { python -m pytest -q tests/test_project_persistence.py tests/test_reaction_flow.py tests/test_reaction_calibration.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller packaging/betun.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/BetunBackend/BetunBackend.exe --check-typing
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Odia typing is incomplete' }
      - name: MCP preflight before compilation
        if: ${{ inputs.full_setup == true }}
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'youcraft-baseline.exe'
          Invoke-WebRequest 'https://github.com/routsourav1729/youcraft/releases/download/v0.1.2-preview.1/YouCraft-Setup-x64.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9fc1896a8fdce6cd74d9a0b807fd9070bf72a02ef73c8b9ae8c1498f02ee2f79') { throw 'Baseline checksum mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'youcraft-baseline'
          $setup = Start-Process $baseline -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$folder`"") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Baseline install failed' }
          & ama-backend/dist/BetunBackend/BetunBackend.exe --check-mcp "$folder/filmcraft-cli.exe" --tools-only
          if ($LASTEXITCODE -ne 0) { throw 'MCP preflight failed before compilation' }
      - name: First-run setup and AI registration
        if: ${{ inputs.full_setup == true }}
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-media.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Automatic app-local media installation failed' }
          $mediaRoot = Join-Path $env:LOCALAPPDATA 'YouCraft'
          $mediaConfig = Get-Content "$mediaRoot/media-tools.json" -Raw | ConvertFrom-Json
          & $mediaConfig.ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'App-local FFmpeg cannot run' }
          if ('${{ inputs.full_setup }}' -ne 'true') { exit 0 }
          $savedProxy = $env:HTTPS_PROXY
          try {
            $env:HTTPS_PROXY = 'http://127.0.0.1:1'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-media.ps1 -Root "$env:RUNNER_TEMP/offline-media" -Archive "$mediaRoot/downloads/ffmpeg-9.0.2.zip"
            if ($LASTEXITCODE -ne 0) { throw 'Cached media installation attempted a network download' }
          } finally { $env:HTTPS_PROXY = $savedProxy }
          & packaging/tests/onboarding.ps1 -Repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'AI registration test failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-models.ps1 -Mode cpu -Root "$env:RUNNER_TEMP/youcraft-runtime-test" -StatusFile "$env:RUNNER_TEMP/youcraft-runtime-status.json" -RuntimeOnly
          if ($LASTEXITCODE -ne 0) { throw 'Clean speech-runtime setup failed' }
          $status = Get-Content "$env:RUNNER_TEMP/youcraft-runtime-status.json" -Raw | ConvertFrom-Json
          if ($status.state -ne 'succeeded') { throw 'Speech-runtime setup did not finish' }
          $savedProxy = $env:HTTPS_PROXY
          try {
            $env:HTTPS_PROXY = 'http://127.0.0.1:1'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-models.ps1 -Mode cpu -Root "$env:RUNNER_TEMP/youcraft-runtime-test" -RuntimeOnly
            if ($LASTEXITCODE -ne 0) { throw 'Installed runtime was not reused offline' }
          } finally { $env:HTTPS_PROXY = $savedProxy }
          & "$env:RUNNER_TEMP/youcraft-runtime-test/speech-cpu/Scripts/python.exe" ama-backend/tests/windows_model_smoke.py "$env:RUNNER_TEMP/youcraft-runtime-test"
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded CPU speaker model failed inference' }
      - name: Reaction runtime and verified model
        if: ${{ inputs.full_setup == true }}
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-vision.ps1 -Root "$env:RUNNER_TEMP/youcraft-runtime-test" -ScriptsDirectory "$env:GITHUB_WORKSPACE/ama-backend/scripts" -StatusFile "$env:RUNNER_TEMP/vision-status.json"
          if ($LASTEXITCODE -ne 0) { throw 'Reaction model setup failed' }
          $savedProxy = $env:HTTPS_PROXY
          try {
            $env:HTTPS_PROXY = 'http://127.0.0.1:1'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/ama/Setup-vision.ps1 -Root "$env:RUNNER_TEMP/youcraft-runtime-test" -ScriptsDirectory "$env:GITHUB_WORKSPACE/ama-backend/scripts"
            if ($LASTEXITCODE -ne 0) { throw 'Reaction pack did not reuse installed files offline' }
          } finally { $env:HTTPS_PROXY = $savedProxy }
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Reuse native compilation cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-youcraft-rust195-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-youcraft-rust195-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Build editor and MCP CLI
        run: cargo +1.95.0 build --locked --release -p filmcraft -p filmcraft-cli
      - name: Native podcast audio, timeline and laptop layout
        if: ${{ inputs.full_checks == true }}
        shell: pwsh
        run: |
          $env:FILMCRAFT_UI_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE/release/ui-preview"
          # Compile one test dependency graph, not separate engine/UI/workspace graphs.
          cargo +1.95.0 test --release -p filmcraft-engine -p filmcraft-ui-egui --lib podcast::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('release/ui-preview/*.png') != ''
        with:
          name: YouCraft-UI-preview
          path: release/ui-preview/*.png
      - name: Assemble application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/YouCraft | Out-Null
          Copy-Item target/release/filmcraft.exe release/YouCraft/YouCraft.exe
          Copy-Item target/release/filmcraft-cli.exe release/YouCraft/
          New-Item -ItemType Directory -Force release/claude-extension | Out-Null
          Copy-Item packaging/claude/manifest.json,target/release/filmcraft-cli.exe,LICENSE-MIT,LICENSE-APACHE,NOTICE release/claude-extension/
          Compress-Archive release/claude-extension/* release/YouCraft-extension.zip -Force
          Move-Item release/YouCraft-extension.zip release/YouCraft/YouCraft.mcpb -Force
          Copy-Item LICENSE-MIT,LICENSE-APACHE,NOTICE,ATTRIBUTION.md release/YouCraft/
          Copy-Item packaging/ama/* release/YouCraft/ -Recurse
          if (Test-Path ama-backend/dist/BetunBackend) {
            Copy-Item ama-backend/dist/BetunBackend release/YouCraft/ -Recurse
          }
          Copy-Item ama-backend/packaging/models-3050.example.json release/YouCraft/
          Copy-Item ama-backend/docs/models.md release/YouCraft/MODEL-SETUP.md
          Copy-Item ama-backend/scripts/download_models.py,ama-backend/scripts/configure_local_models.py,ama-backend/scripts/setup_vision.py release/YouCraft/
      - name: Build incremental update files
        shell: pwsh
        run: |
          python packaging/build_updates.py release/YouCraft release/incremental $env:YOUCRAFT_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./packaging/ama/Apply-FileUpdate.ps1
          $manifest = Get-Content "release/incremental/files-$env:YOUCRAFT_VERSION.json" -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files) { Get-SafeUpdatePath "$env:GITHUB_WORKSPACE/release/YouCraft" $file.path | Out-Null }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler "/DRepoRoot=$env:GITHUB_WORKSPACE" "/DYouCraftVersion=$env:YOUCRAFT_VERSION" packaging/ama-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: YouCraft-Incremental
          path: release/incremental/
      - name: Install and check the packaged local helper
        shell: pwsh
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'ama-installed'
          $data = Join-Path $env:RUNNER_TEMP 'ama-smoke-data'
          $setup = Start-Process release/YouCraft-Setup-x64.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path "$installed/YouCraft.exe")) { throw 'Editor missing from installation' }
          if (-not (Test-Path "$installed/Update-YouCraft.ps1")) { throw 'Updater missing from installation' }
          $mediaConfig = Get-Content "$env:LOCALAPPDATA/YouCraft/media-tools.json" -Raw | ConvertFrom-Json
          $env:BETUN_FFMPEG = $mediaConfig.ffmpeg
          $env:BETUN_FFPROBE = $mediaConfig.ffprobe
          $env:BETUN_NO_BROWSER = '1'
          $env:BETUN_DATA_DIR = $data
          $env:YOUCRAFT_INSTALLED_SMOKE = $installed
          $media = Join-Path $env:RUNNER_TEMP 'youcraft-media'
          New-Item -ItemType Directory -Force $media | Out-Null
          ffmpeg -y -f lavfi -i 'sine=frequency=440:duration=4' -ar 16000 -ac 1 "$media/master.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($camera in @('host','guest')) {
            ffmpeg -y -f lavfi -i 'color=c=blue:s=160x90:r=25:d=4' -i "$media/master.wav" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$media/$camera.mp4"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $config = Join-Path $env:RUNNER_TEMP 'youcraft-synthetic-models.json'
          @{diarize=@{revision='synthetic-test-v1';device='cpu';command=@((Get-Command python).Source, "$env:GITHUB_WORKSPACE/ama-backend/tests/fixtures/speaker_provider.py")}} | ConvertTo-Json -Depth 5 | Set-Content $config -Encoding utf8NoBOM
          $env:BETUN_MODEL_CONFIG = $config
          $helper = Start-Process "$installed/BetunBackend/BetunBackend.exe" -ArgumentList @('--port', '18765', '--data-dir', "`"$data`"") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/ama-helper.log" -RedirectStandardError "$env:RUNNER_TEMP/ama-helper-error.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($helper.HasExited) { throw 'Packaged helper exited during startup' }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:18765/health -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.service -eq 'youcraft' -and $health.protocol_version -eq 1) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged helper did not become ready' }
            $token = (Get-Content "$data/api-token" -Raw -Encoding utf8).Trim()
            $body = [Text.Encoding]::UTF8.GetBytes((@{name='ନମସ୍କାର'} | ConvertTo-Json))
            $episode = Invoke-RestMethod http://127.0.0.1:18765/v1/projects -Method Post -Headers @{Authorization="Bearer $token"} -ContentType 'application/json; charset=utf-8' -Body $body
            if ($episode.name -ne 'ନମସ୍କାର') { throw 'Odia text did not round-trip through the packaged helper' }
            $env:YOUCRAFT_SMOKE_ENDPOINT = 'http://127.0.0.1:18765'
            $env:YOUCRAFT_SMOKE_TOKEN = $token
            $env:YOUCRAFT_SMOKE_MEDIA = $media
            $env:YOUCRAFT_SMOKE_AUTO_IDENTIFY = '1'
            if ('${{ inputs.full_setup }}' -eq 'true') {
              python ama-backend/tests/packaged_model_smoke.py $config "$env:RUNNER_TEMP/youcraft-runtime-test/models.json" $media
              if ($LASTEXITCODE -ne 0) { throw 'Installed helper could not run the real CPU speaker model' }
            }
          } catch {
            Get-Content "$env:RUNNER_TEMP/ama-helper-error.log" -Tail 40 -ErrorAction SilentlyContinue
            throw
          } finally {
            if (-not $helper.HasExited) { taskkill /PID $helper.Id /T /F | Out-Null }
          }
      - name: Installed MCP tools and live podcast connection
        shell: pwsh
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'ama-installed'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$installed/Check-AI.ps1" -ToolsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP handshake or tool discovery failed' }
          $editor = Start-Process "$installed/YouCraft.exe" -ArgumentList @('--empty','--no-recover','--graphics','software','--data-dir',"$env:RUNNER_TEMP/mcp-editor") -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 20; $i++) {
              if ($editor.HasExited) { throw 'Editor exited before MCP check' }
              $socket = New-Object Net.Sockets.TcpClient
              try { $socket.Connect('127.0.0.1',9876); $ready = $true } catch {} finally { $socket.Dispose() }
              if ($ready) { break }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Editor control connection unavailable' }
            python ama-backend/tests/stage_one_smoke.py
            if ($LASTEXITCODE -ne 0) { throw 'Project and audio recovery UI check failed' }
            python ama-backend/tests/reaction_ui_smoke.py
            if ($LASTEXITCODE -ne 0) { throw 'Reaction workspace UI check failed' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$installed/Check-AI.ps1"
            if ($LASTEXITCODE -ne 0) { throw 'MCP could not inspect the installed editor podcast workflow' }
          } finally { if (-not $editor.HasExited) { taskkill /PID $editor.Id /T /F | Out-Null } }
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('release/YouCraft-Setup-x64.exe') != ''
        with:
          name: YouCraft-Windows
          path: release/YouCraft-Setup-x64.exe

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('release/ui-check/*.png') != ''
        with:
          name: YouCraft-UI-check
          path: release/ui-check/

  publish:
    needs: windows
    if: github.ref == 'refs/heads/ama-bartalap' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: downloads
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: YouCraft-Incremental
          path: incremental
      - uses: actions/download-artifact@v4
        with:
          name: YouCraft-Windows
          path: installer
      - name: Validate and publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat source/packaging/youcraft-version.txt | tr -d '\r\n')
          python source/packaging/publish_update.py incremental installer/YouCraft-Setup-x64.exe site "$version"
          gh release create "v${version}-preview.1" installer/YouCraft-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "YouCraft $version" --notes-file "source/docs/RELEASE-$version.md"
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add .
          git -C site commit -m "Publish verified YouCraft $version ($GITHUB_SHA)"
          git -C site push origin HEAD:downloads
          # GITHUB_TOKEN pushes do not automatically trigger a Pages build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Confirm the public update feed
        run: |
          python source/packaging/verify_update_feed.py "$(cat source/packaging/youcraft-version.txt | tr -d '\r\n')"
